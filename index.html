<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 YEARS OF FROST ✦ Welcoming Page</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Canvas for Floating Ambient Particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="music/bg-music.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Audio Control -->
    <button id="music-toggle" class="music-btn" aria-label="Toggle Music">
        <i class="fas fa-music"></i>
    </button>

    <!-- Welcoming / Countdown Container -->
    <div class="welcome-container">
        <main class="content-wrapper">
            <!-- Top Sub-header -->
            <div class="sub-header">
                <span class="diamond-icon">✦</span>
                <span class="sub-header-text">22 YEARS OF FROST</span>
                <span class="diamond-icon">✦</span>
            </div>

            <!-- Main Title & Welcoming Message -->
            <div class="title-group">
                <h1 class="main-title">Her Special Day <span class="italic-subtitle">is Coming</span></h1>
                <p class="welcome-caption">"The People we meet become part of our story" 💖</p>
            </div>

            <!-- Glassmorphic Countdown Timer -->
            <div class="countdown-container">
                <!-- Days Card -->
                <div class="countdown-card">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <!-- Hours Card -->
                <div class="countdown-card">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <!-- Minutes Card -->
                <div class="countdown-card">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <!-- Seconds Card -->
                <div class="countdown-card">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>

            <!-- Bottom Status Indicator & Locked Button -->
            <div class="action-group">
                <p class="status-indicator" id="status-text">
                    <i class="fa-solid fa-hourglass-half"></i> A few seconds remaining... 💖
                </p>
                
                <button id="unlocked-action-btn" class="locked-btn" disabled>
                    <i class="fa-solid fa-lock" id="btn-lock-icon"></i> 
                    <span id="btn-text">WAIT FOR THE MAGIC</span> 
                    <i class="fa-regular fa-bell" id="btn-bell-icon"></i>
                </button>
            </div>

            <!-- Birthday Girl Secret Universe Access Portal -->
            <div class="birthday-girl-portal">
                <a href="birthday-girl.html" class="portal-link">
                    <i class="fa-solid fa-crown"></i> Frost's Universe Portal ✨
                </a>
            </div>

            <!-- Designed by Credits Footer -->
            <footer class="marking-footer">
                Designed by Delight Chetter (0822349565 for more info) 🤍
            </footer>
        </main>
    </div>

    <!-- Firebase configuration & app scripts -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
